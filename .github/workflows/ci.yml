name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
        # The peer range is ^5 || ^6: test the lockfile's 5.x and a pinned
        # 6.x. Bump the 6.x here and in the live job together.
        neo4j-driver: [lockfile, '6.3.0']

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Use neo4j-driver ${{ matrix.neo4j-driver }}
        env:
          NEO4J_DRIVER: ${{ matrix.neo4j-driver }}
        run: bash scripts/ci/use-neo4j-driver.sh "$NEO4J_DRIVER"

      - name: Build
        run: pnpm run build

      - name: Verify generated types are up to date
        run: pnpm run verify:examples

      - name: Lint
        run: pnpm run lint

      # README / llms-full.txt TypeScript examples against src/ and the
      # generator. Driver-independent: one leg is enough.
      - name: Type-check documentation examples
        if: matrix.node-version == 22 && matrix.neo4j-driver == 'lockfile'
        run: pnpm run docs:typecheck

      - name: Test
        run: pnpm run test

  live:
    strategy:
      fail-fast: false
      matrix:
        neo4j-driver: [lockfile, '6.3.0']
    uses: ./.github/workflows/live.yml
    with:
      neo4j-driver: ${{ matrix.neo4j-driver }}
